services:
  - type: web
    name: redmanfinance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_BASE_URL
        value: https://redmanfinance.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_PORT_FALLBACK
        value: "465"
      - key: MAKE_FINANCE_ALERT_WEBHOOK_URL
        sync: false
      - key: MAKE_FINANCE_ALERT_WEBHOOK_API_KEY
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
